<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#10271f">
  <title>Julies julekalender ♥</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div id="particles" aria-hidden="true"></div>
  <main>
    <header class="greeting">
      <h1>Julekalender til Julie</h1>
      <p>Fra din dejligste kæreste</p>
    </header>
    <section class="count" aria-label="Nedtælling">
      <span id="status">Henter julekalenderen…</span>
      <strong id="timer">–</strong>
    </section>
    <section id="doors" aria-label="Julekalenderlåger"></section>
    <footer class="footer">Lavet med kærlighed, kun til dig. ♥<br>Din Tobias</footer>
  </main>

  <dialog id="letter" aria-labelledby="title">
    <button id="close" type="button" aria-label="Luk">×</button>
    <span class="eyebrow" id="date"></span>
    <h2 id="title"></h2>
    <p id="message"></p>
    <section id="gift" class="gift-card" aria-labelledby="gift-title" hidden>
      <span class="eyebrow">Gavekort til Julie</span>
      <h3 id="gift-title"></h3>
      <p id="gift-description"></p>
    </section>
    <div id="media"></div>
  </dialog>
</body>
</html>
